name: Forward tracking

# Weekdays after the US close. 22:15 UTC = 17:15 New York in winter (EST)
# and 18:15 in summer (EDT), so the day's bar is final either way.
on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forward-tracking
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Append new forward day(s) and rebuild report
        run: python run.py forward

      - name: Commit forward log and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward/ docs/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Forward tracking: $(date -u +%Y-%m-%d)"
            git push
          fi
